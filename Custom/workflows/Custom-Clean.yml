# SPDX-License-Identifier: MIT
# 由 Custom/bootstrap-fork.sh 安装：Release 清理 + 编译日兜底
#
# 两条时间线，用 github.event.schedule 区分执行哪个步骤：
#   1) 清理：编译日（10/20/28/29/30/31）北京时间 20:00（UTC 12:00）
#      —— 打包前 1 小时，只清一次，不再每天扫
#   2) 兜底：编译日次日北京时间 03:00（UTC 19:00）
#      —— 只检查「昨天」该编的那次有没有产物，漏了就补一次
#      日期只用 1 / 11 / 21 三条 cron（1 号对应"月末那次"）
name: Custom-Clean

on:
  schedule:
    # === 清理：编译日 20:00（打包前 1 小时）===
    - cron: 0 12 10 * *
    - cron: 0 12 20 * *
    - cron: 0 12 28 * *
    - cron: 0 12 29 * *
    - cron: 0 12 30 * *
    - cron: 0 12 31 * *
    # === 兜底：编译日次日 03:00 ===
    - cron: 0 19 11 * *   # 10 号 → 11 号凌晨
    - cron: 0 19 21 * *   # 20 号 → 21 号凌晨
    - cron: 0 19 1 * *    # 月末（28/29/30/31）→ 次月 1 号凌晨
  workflow_dispatch:

permissions: write-all

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  KEEP_MONTHS: '36'

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Trim Releases(编译前 1 小时清理)
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.schedule, '0 12') }}
        run: |
          set -Eeuo pipefail
          chmod +x Custom/release-clean.sh
          Custom/release-clean.sh

      - name: Guard(编译日次日兜底)
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.schedule, '0 19') }}
        run: |
          set -Eeuo pipefail

          # 最近 36 小时已有产物就跳过，避免和刚跑完的编译撞车
          RECENT="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
            --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("-WIFI-(YES|NO)-"))
                       | select((.createdAt | fromdateiso8601) > (now - 129600))] | length' 2>/dev/null || echo 0)"
          if [ "${RECENT:-0}" -gt 0 ]; then
            echo "[ok] 最近 36 小时已有 ${RECENT} 个固件产物，跳过兜底"
            exit 0
          fi

          # 只检查「昨天」：cron 只在 1/11/21 号跑，昨天一定是某个编译日
          D="$(TZ=Asia/Shanghai date -d yesterday +%d)"
          TODAY="$(TZ=Asia/Shanghai date +%d)"
          TAGDATE="$(TZ=Asia/Shanghai date -d yesterday +%y.%m.%d)"
          HUMAN="$(TZ=Asia/Shanghai date -d yesterday +%Y-%m-%d)"

          IS_BUILD=false
          case "$D" in
            10|20) IS_BUILD=true ;;
            28|29|30|31) [ "$TODAY" = "01" ] && IS_BUILD=true ;;
          esac
          if [ "$IS_BUILD" != "true" ]; then
            echo "[skip] ${HUMAN} 不是编译日，无需兜底"
            exit 0
          fi

          if gh release list --repo "$GITHUB_REPOSITORY" --limit 40 --json tagName \
               --jq '.[].tagName' 2>/dev/null | grep -q -- "$TAGDATE"; then
            echo "[ok] ${HUMAN} 已有产物（tag 含 ${TAGDATE}），不补编"
            exit 0
          fi

          echo "[trigger] ${HUMAN} 是编译日但没有产物，补触发 CUSTOM-AX6"
          gh workflow run CUSTOM-AX6.yml --repo "$GITHUB_REPOSITORY" --ref main